[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "spd-hot"
version = "0.3.0"
description = "Reusable swimming-pool detector helpers for HOT fAIr model onboarding."
readme = "README.md"
requires-python = ">=3.12"
# Inference core only (the CPU serving image installs this plus onnxruntime, which the fAIr serving base provides):
# numpy and Pillow for preprocessing, rasterio and pyproj for georeferencing. No torch, no shapely.
dependencies = [
    "numpy>=1.26",
    "Pillow>=10.0",
    "pyproj>=3.6",
    "rasterio>=1.3",
]

[project.optional-dependencies]
# What the fAIr training image installs: fine-tuning and ONNX export. Training runs on a GPU, but the CUDA build of
# torch is chosen by the image (a CUDA wheel index), not by this metadata; Ultralytics brings torch itself.
train = [
    "onnx>=1.17",
    # Needed at export time: Ultralytics' ONNX export simplifies the graph with onnxslim and loads it with
    # onnxruntime; without them it installs both itself while exporting. Versions are Ultralytics' own minimums.
    "onnxslim>=0.1.82",
    "onnxruntime>=1.20",
    "ultralytics>=8.4.0",
]
# Run an exported ONNX locally (`scripts/evaluate.py`, `scripts/predict.py`). The fAIr serving base brings its own onnxruntime.
infer = [
    "onnxruntime>=1.18",
]
test = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/spd_hot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
