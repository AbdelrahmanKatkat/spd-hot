[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "spd-hot"
version = "0.1.0"
description = "Reusable swimming-pool detector helpers for HOT fAIr model onboarding."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "Pillow>=10.0",
    "pyproj>=3.6",
    "rasterio>=1.3",
]

[project.optional-dependencies]
train = [
    "onnx>=1.17",
    "onnxscript>=0.1",
    "ultralytics>=8.4.0",
]
test = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
